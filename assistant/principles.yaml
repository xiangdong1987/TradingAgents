# 投资大师理念与原则
# 来源：历史文献与知识笔记（AI 生成内容已与史料核对）
# 
# 用途：为 advisor 与 chat 提供指导性检验框架，不覆盖用户的硬性规则与数值纪律。
# 用户的硬性规则：70%+ 被动指数、<30% 能力圈内个股、不碰期权/杠杆/套利、不做波段。
# 
# 如何添加新的大师：
# 1. 在下方 masters 列表添加新条目，包含 name（姓名）、source（来源）、principles（原则列表）
# 2. principles 每条写为可操作的检验点，用中文表述
# 3. 如有史料准确性说明或应用边界，写在 notes 字段

masters:
  - name: 白圭
    era: 战国初期
    title: 治生之祖
    source: 《史记·货殖列传》，经抖音「书三说」第 18 集 AI 生成视频引入，已与维基文库原文核对
    notes: |
      视频为 AI 生成，部分改编（如"仁能以取予"原文为"仁不能以取予"，是门槛而非格言）。
      白圭的周期囤货与品类切换是商品交易，应用到股票时仅作为指数层面再平衡的情绪自检，
      不得解读为行业轮动或波段交易信号——用户规则明确禁止波段操作。
    principles:
      - key: 人弃我取
        text: 当市场恐慌、他人抛售时，检查标的是真便宜还是价值陷阱。不是机械逆向，而是独立判断价值与价格的偏离。
        application: 大跌时继续定投指数，按再平衡规则加仓偏离目标的宽基；个股需用估值与一线数据验证增长假设，避免抄底价值陷阱。

      - key: 人取我与
        text: 当市场狂热、他人追涨时，考虑获利了结或再平衡，不试图抓住绝对顶部。
        application: 只通过再平衡机械卖出超配部分（如个股超 8% 上限时 trim），不主观预测顶部、不因"还能涨"拖延执行。

      - key: 乐观时变
        text: 观察周期与时势变化，但不盲目追逐短期波动。
        application: 关注宏观周期作为背景认知，但不据此做行业轮动或波段择时——用户只在指数层面做战略再平衡。

      - key: 留三成、不能先倒
        text: 保持现金缓冲，判断对了也要活到兑现那天。粮价可以再跌，咱们不能先倒。
        application: 现金缓冲不低于组合 5%（cashFloorPct），个股上限 30%（实际 8% 单票 + 15% 卫星总量），下跌时不追加超过上限，生活备用金不入市。

      - key: 看对只算一半，等得到才算赢
        text: 有耐心持有到价值兑现，不因短期波动频繁进出。
        application: 买入时写清持有期与失效条件，长期持有；不因一时浮亏或邻近反弹就改变计划。

      - key: 智勇仁强
        text: |
          智：看懂变化（估值、基本面、周期位置）
          勇：看懂后敢执行（不因恐惧或贪婪犹豫）
          仁：取予有度，不赚最后一个铜板（个股达目标即按计划卖，不追顶）
          强：守住自己的判断，不被他人情绪带走
        application: |
          没有自己的估值计算不动手；计划内的买卖果断执行不拖延；
          不因群聊/大V 一句话改仓位；个股达估值目标时按计划卖出，不因"还能涨"贪心。

      - key: 不把别人的情绪当成自己的判断
        text: 逆向不是机械反向操作，而是价值判断独立于市场情绪。区分价格（市场给的）与价值（基本面支撑的）。
        application: 买卖决策基于估值纪律与数据验证，不因市场气氛（FOMO、恐慌）单独触发交易；别人都在谈论的热点不是买入信号，冷门也不自动是机会。

    guardrails: |
      用户的硬性规则始终优先于上述原则：
      - 70%+ 被动指数，<30% 能力圈内个股（软件/云/SaaS/电商/SCM）
      - 不碰期权、杠杆、套利
      - 不做波段、不做行业轮动
      因此白圭的"乐观时变"（跨品类切换）只能解读为指数层面的战略再平衡与情绪自检，
      绝不可作为频繁切换行业 ETF 或个股的依据。数值纪律（policy.py）永远是硬约束。
